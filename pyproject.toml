[project]
name = "kuramoto-app-vanilla"
version = "0.1.0"
description = "Vanilla Kuramoto Streamlit App"
requires-python = ">=3.11"
dependencies = [
    "ipython>=9.1.0",
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "plotly>=6.0.1",
    "scipy>=1.15.2",
    "sqlalchemy>=2.0.40",
    "streamlit>=1.44.1",
    "trafilatura>=2.0.0",
]
# ------------------------------------------------------------------
# Optional extras
# ------------------------------------------------------------------
[project.optional-dependencies]
dev = [
  "black>=23.7",
  "isort>=5.12",
  "ruff>=0.1",
  "pre-commit>=3.3"
]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.5"
]

# ------------------------------------------------------------------
# Source-layout configuration
# ------------------------------------------------------------------
# Tell setuptools that *modules* (single .py files) live in `src/`.
[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
