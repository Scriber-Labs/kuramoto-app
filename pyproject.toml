[project]
name = "streamlit-template"
version = "0.1.0"
description = "Personal Streamlit app template"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
